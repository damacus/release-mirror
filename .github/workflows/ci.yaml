name: Verify catalogue
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE*'
      - '.github/workflows/docs.yaml'
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      application: ${{ github.event_name != 'pull_request' || steps.paths.outputs.app == 'true' }}
    steps:
      - name: Check whether application files changed
        if: github.event_name == 'pull_request'
        id: paths
        uses: dorny/paths-filter@v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!docs/**'
              - '!openspec/**'
              - '!README.md'
              - '!AGENTS.md'
              - '!LICENSE*'
              - '!.github/workflows/docs.yaml'

  application:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
            index.rubygems.org:443
            registry.npmjs.org:443
            nodejs.org:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            deb.debian.org:80
            deb.debian.org:443
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - run: bundle exec rake test
      - name: Scan application templates with Brakeman
        run: bundle exec brakeman --force --no-pager --quiet
      - name: Audit Ruby dependency advisories
        run: bundle exec bundle-audit check --update
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
      - name: Install pinned Renovate test engine
        run: npm install --prefix /tmp/renovate --ignore-scripts --no-audit --no-fund renovate@44.222.5
      - name: Start isolated synthetic catalogue
        run: |
          FIXTURE_DIR=/tmp/release-mirror-fixture bundle exec ruby test/support/preview.rb >/tmp/catalogue-fixture.log 2>&1 &
          for _attempt in {1..30}; do
            if curl --fail --silent http://localhost:9292/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify language-neutral HTTP contract
        env:
          CONTRACT_TOKEN_FILE: /tmp/release-mirror-fixture/token
        run: ruby test/contract/acceptance.rb
      - name: Verify Renovate version and digest updates
        env:
          RENOVATE_ENTRY: /tmp/renovate/node_modules/renovate/dist/renovate.js
        run: node test/contract/renovate.mjs
      - name: Verify portable container
        run: |
          docker build -t release-mirror:local .
          ruby test/contract/container.rb

  final:
    needs: [changes, application]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks or a docs-only skip
        env:
          PASSED: ${{ needs.changes.result == 'success' && (needs.application.result == 'success' || (needs.changes.outputs.application == 'false' && needs.application.result == 'skipped')) }}
        run: test "$PASSED" = true
