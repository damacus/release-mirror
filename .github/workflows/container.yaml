name: Publish container
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/damacus/release-mirror:${{ github.ref_name }}
            ghcr.io/damacus/release-mirror:sha-${{ github.sha }}
      - name: Verify published architectures and report digest
        env:
          IMAGE: ghcr.io/damacus/release-mirror
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "$RUNNER_TEMP/manifest.json"
          ruby -rjson -e 'm = JSON.parse(File.read(ARGV.fetch(0))); p = m.fetch("manifests").map { |v| v.fetch("platform", {}) }; abort "Missing amd64 or arm64" unless %w[amd64 arm64].all? { |a| p.any? { |x| x["os"] == "linux" && x["architecture"] == a } }' "$RUNNER_TEMP/manifest.json"
          echo "Published \`$IMAGE@$DIGEST\` for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"
