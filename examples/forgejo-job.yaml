# Merge this job configuration into the producer's successful build/push job.
# The producer supplies its ACTUAL pushed tags/digest/platforms.
# It decides when to publish; this example adds no tag or release policy.
jobs:
  build-and-publish:
    runs-on: docker
    enable-openid-connect: true
    steps:
      # Your existing checkout/build/push steps must precede this step.
      # Ruby and CA certificates must be available in the job container.
      - name: Publish the pushed image metadata
        # Pin to a reviewed commit containing action.yml before use.
        uses: https://github.com/damacus/release-mirror@main
        with:
          service: widget
          tags: |
            v1.2.3
            actual-upstream-tag
          digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          platforms: '[{"os":"linux","architecture":"arm64","variant":"v8"}]'
